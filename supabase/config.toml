project_id = "rapid-fire"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.migrations]
enabled = true
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[realtime]
enabled = true
[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173"]
enable_signup = true
[auth.email]
enable_signup = false
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/before_user_created"
# Enable/configure Google credentials in M2, after provisioning allowed_domains.
[storage]
enabled = true
