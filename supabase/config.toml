project_id = "rapid-fire"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.migrations]
enabled = true
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[realtime]
enabled = true
[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173"]
enable_signup = true
[auth.email]
enable_signup = false
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/before_user_created"
[storage]
enabled = true

# Hosted production project, served at https://www.vishnugandarapu.in/rapid-fire/.
# `supabase config push` applies these overrides; the Google secret is read from
# the environment and never committed.
[remotes.production]
project_id = "sxxpexqgnhzzgwpntpnp"
[remotes.production.auth]
site_url = "https://www.vishnugandarapu.in/rapid-fire/"
additional_redirect_urls = [
  "https://www.vishnugandarapu.in/rapid-fire/**",
  "http://127.0.0.1:5173/**",
  "http://localhost:5173/**",
]
[remotes.production.auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false
