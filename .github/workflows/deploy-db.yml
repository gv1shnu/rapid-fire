name: Deploy database
# Applies any pending Supabase migrations to the hosted project whenever a
# migration lands on main. The frontend already auto-deploys via Cloudflare
# Pages; this closes the loop so the database schema ships from main too — no
# manual `supabase db push` needed.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-db.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: deploy-db
  cancel-in-progress: false
jobs:
  migrate:
    name: push migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # The project ref is already public (it's in the client's VITE_SUPABASE_URL),
      # so it lives here rather than in a secret.
      PROJECT_REF: your-project-ref
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link the hosted project
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Apply pending migrations
        run: supabase db push
