name: Deploy database
# Applies any pending Supabase migrations to your hosted project. Manual only:
# run it from the Actions tab after configuring the secret below.
#
# It connects straight to the database with a connection string (--db-url), so
# it needs no Supabase personal access token — nothing here expires. The single
# secret SUPABASE_DB_URL holds the "Session pooler" URI from the dashboard
# (Connect -> Session pooler), which includes the database password.
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: deploy-db
  cancel-in-progress: false
jobs:
  migrate:
    name: push migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply pending migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL"
